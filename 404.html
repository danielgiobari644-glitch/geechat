<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GeeChat — redirecting…</title>
  <script>
    // Fallback for hosts that return 404 for a directory URL ("…/geechat/")
    // instead of serving index.html. If this page is served for such a URL,
    // bounce to the real entry point, preserving the query and hash.
    // On hosts with proper directory indexing this file is never used.
    (function () {
      var t = (location.search || '') + (location.hash || '');
      location.replace('./index.html' + t);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=./index.html">
</head>
<body>
  <p style="font-family: system-ui, sans-serif; padding: 2rem;">Opening GeeChat… <a href="./index.html">Continue</a></p>
</body>
</html>
